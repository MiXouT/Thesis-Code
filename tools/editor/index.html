<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Layout Editor</title>
    <link rel="stylesheet" href="style.css?v=multi_layout_13">
</head>

<body>
    <div class="container">
        <div class="sidebar">
            <h2>Layout Editor</h2>

            <div class="section">
                <h3>Layout Management</h3>
                <div class="control-group">
                    <label>Saved Layouts</label>
                    <div style="display: flex; gap: 5px; margin-bottom: 10px;">
                        <select id="layout-select" style="flex: 1;"></select>
                        <button id="btn-delete-layout" type="button" class="action-btn icon-btn" title="Delete Layout"
                            style="width: auto; padding: 8px; margin: 0; background: #a00;">🗑️</button>
                    </div>
                    <div class="button-grid">
                        <button id="btn-load-layout" class="action-btn">Load</button>
                        <button id="btn-rename-layout" class="action-btn">Rename</button>
                        <button id="btn-save" class="action-btn primary">Save</button>
                        <button id="btn-save-as" class="action-btn">Save As...</button>
                    </div>
                </div>
            </div>

            <div class="section">
                <h3>Tools</h3>
                <div class="tool-group">
                    <button id="tool-select" class="tool-btn active">Select</button>
                    <button id="tool-wall" class="tool-btn">Draw Wall</button>
                    <button id="tool-room" class="tool-btn">New Room</button>
                </div>
            </div>

            <div class="section">
                <h3>Properties</h3>
                <div id="properties-panel">
                    <p class="hint">Select an object to edit properties</p>
                </div>
            </div>

            <div class="section">
                <h3>Floors</h3>
                <div id="floor-list">
                    <!-- Floors will be added here -->
                </div>
                <button id="btn-add-floor" class="action-btn small" style="width: 48%; display: inline-block;">+ Add
                    Floor</button>
                <button id="btn-remove-floor" class="action-btn small"
                    style="width: 48%; display: inline-block; background: #a00;">- Remove</button>
            </div>

            <div class="section bottom">
                <button id="btn-load" class="action-btn secondary">Reload</button>
                <div id="status-msg"></div>
            </div>
        </div>

        <div class="main-area">
            <div class="toolbar">
                <span id="cursor-coords">0, 0</span>
                <label>Grid: <input type="number" id="grid-size" value="1" min="0.5" step="0.5"> m</label>
                <label>Zoom: <input type="range" id="zoom-level" min="0.5" max="3" step="0.1" value="1"></label>
            </div>
            <div class="canvas-container">
                <canvas id="editor-canvas"></canvas>
            </div>
        </div>
    </div>
    <div id="custom-modal" class="modal hidden">
        <div class="modal-content">
            <h3 id="modal-title">Input</h3>
            <p id="modal-message" class="hidden"></p>
            <input type="text" id="modal-input" placeholder="Enter value">
            <div class="modal-actions">
                <button id="btn-modal-cancel" class="tool-btn">Cancel</button>
                <button id="btn-modal-ok" class="tool-btn active">Create</button>
            </div>
        </div>
    </div>

    <div id="delete-modal" class="modal hidden">
        <div class="modal-content">
            <h3 style="color: #a00;">Delete Layout</h3>
            <p id="delete-message" style="margin: 20px 0; color: #e0e5ec;">Are you sure?</p>
            <div class="modal-actions">
                <button id="btn-delete-cancel" class="tool-btn">Cancel</button>
                <button id="btn-delete-confirm" class="tool-btn" style="background: #a00; color: white;">Delete</button>
            </div>
        </div>
    </div>
    <script src="script_v13.js" defer></script>
</body>

</html>
